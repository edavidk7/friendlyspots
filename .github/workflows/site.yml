name: site

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      # Code results come from site/_freeze/, so no R or Python is needed here
      - run: quarto render site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@v4
